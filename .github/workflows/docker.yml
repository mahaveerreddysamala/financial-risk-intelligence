name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag financial-risk-intelligence:ci .

      - name: Verify image metadata
        run: docker image inspect financial-risk-intelligence:ci --format '{{.Config.WorkingDir}}'
