name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        run: python -m pytest -q

      - name: Benchmark model quality
        run: python -m financial_risk.models.benchmark --rows 20000 --seed 42

      - name: Enforce model quality gate
        run: python scripts/check_model_quality.py --benchmark artifacts/model-benchmark.csv
