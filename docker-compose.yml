services:
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    container_name: financial-risk-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >-
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic financial-risk-events --partitions 3
        --replication-factor 1; do sleep 1; done;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic financial-risk-scored --partitions 1
        --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic financial-risk-dlq --partitions 1
        --replication-factor 1;
        sleep 365d
    healthcheck:
      test: ["CMD-SHELL", "topics=$(/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list 2>/dev/null); echo \"$$topics\" | grep -Fx 'financial-risk-events' >/dev/null && echo \"$$topics\" | grep -Fx 'financial-risk-scored' >/dev/null && echo \"$$topics\" | grep -Fx 'financial-risk-dlq' >/dev/null"]
      interval: 2s
      timeout: 10s
      retries: 15
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    container_name: financial-risk-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-risk-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      MODEL_ARTIFACT_PATH: /app/artifacts
      MODEL_ARTIFACT_FILE: financial-fraud-xgboost.joblib
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./artifacts:/app/artifacts:ro
    ports:
      - "8000:8000"
    depends_on:
      kafka-init:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      MODEL_ARTIFACT_FILE: /app/artifacts/financial-fraud-xgboost.joblib
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INPUT_TOPIC: financial-risk-events
      KAFKA_OUTPUT_TOPIC: financial-risk-scored
      KAFKA_DLQ_TOPIC: financial-risk-dlq
      KAFKA_GROUP_ID: financial-risk-scoring-worker
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: financial-risk
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      kafka-init:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: financial-risk-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    container_name: financial-risk-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
