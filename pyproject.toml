[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-risk-intelligence"
version = "0.1.0"
description = "Financial fraud and risk intelligence platform"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<22",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
exclude = ["notebooks"]

[tool.ruff.lint.isort]
from-first = false
known-first-party = ["financial_risk"]
order-by-type = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
